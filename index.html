<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wad Elhaj AI - منصة تحريك الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .card { background-color: #1e293b; border-radius: 1rem; padding: 1.5rem; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-blue-500">Wad Elhaj AI</h1>
        <p class="text-center text-gray-400">تحويل الصور إلى فيديو بالذكاء الاصطناعي</p>

        <div class="card space-y-4">
            <label class="block text-sm font-medium">1. ارفع صورتك الشخصية</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            
            <label class="block text-sm font-medium">2. وصف الحركة (بالإنجليزي)</label>
            <textarea id="promptInput" rows="3" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white" placeholder="مثال: A man smiling and blinking eyes..."></textarea>
            
            <button onclick="generateVideo()" id="btnText" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                بدء تحريك الصورة الآن
            </button>
        </div>

        <div id="resultArea" class="card min-h-[200px] flex items-center justify-center border-2 border-dashed border-slate-700">
            <p class="text-gray-500 text-center" id="statusMessage">ستظهر النتيجة هنا...</p>
        </div>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value;
            const imageInput = document.getElementById('imageInput');
            const statusMessage = document.getElementById('statusMessage');
            const btn = document.getElementById('btnText');

            if (!imageInput.files[0] || !prompt) {
                alert("يرجى رفع صورة وكتابة وصف للحركة");
                return;
            }

            // تجهيز الواجهة للانتظار
            btn.disabled = true;
            btn.innerText = "جاري المعالجة... (قد يستغرق دقيقة)";
            statusMessage.innerText = "جاري إرسال الصورة للمحرك... انتظر قليلاً";

            const reader = new FileReader();
            reader.readAsDataURL(imageInput.files[0]);
            reader.onload = async () => {
                const base64Image = reader.result;

                try {
                    // إرسال الطلب لـ Vercel API
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Image, prompt: prompt })
                    });

                    const data = await response.json();

                    if (data.videoUrl) {
                        document.getElementById('resultArea').innerHTML = `
                            <video controls autoplay loop class="w-full rounded-lg">
                                <source src="${data.videoUrl}" type="video/mp4">
                            </video>`;
                        btn.innerText = "بدء تحريك الصورة الآن";
                        btn.disabled = false;
                    } else {
                        throw new Error(data.error || "خطأ غير معروف");
                    }
                } catch (error) {
                    alert("حدث خطأ: " + error.message);
                    btn.disabled = false;
                    btn.innerText = "حاول مرة أخرى";
                    statusMessage.innerText = "فشل التوليد، تأكد من مفتاح API";
                }
            };
        }
    </script>
</body>
</html>
