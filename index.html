<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wad Elhaj AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #imagePreview { max-width: 100%; max-height: 300px; display: none; border-radius: 8px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-500 mb-2">Wad Elhaj AI</h1>
            <p class="text-gray-400">منصة تحريك الصور بالذكاء الاصطناعي</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xl mb-4 font-semibold">1. إعداد المشهد</h2>
                <div class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 transition" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" hidden accept="image/*">
                    <div id="uploadPlaceholder">
                        <p class="text-gray-400">اضغط هنا لرفع صورة الشخصية</p>
                    </div>
                    <img id="imagePreview" src="" alt="Preview">
                </div>
                
                <div class="mt-6">
                    <label class="block text-sm text-gray-400 mb-2">وصف الحركة (Prompt):</label>
                    <textarea id="promptText" class="w-full bg-slate-800 rounded-lg p-3 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" placeholder="مثلاً: رجل يتحدث بوقار وخلفه مكتبة..."></textarea>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl flex flex-col justify-between">
                <h2 class="text-xl mb-4 font-semibold">2. النتيجة</h2>
                <div id="resultArea" class="bg-slate-900 aspect-video rounded-xl flex items-center justify-center border border-gray-800">
                    <p class="text-gray-500 italic">الفيديو سيظهر هنا بعد المعالجة</p>
                </div>
                <button onclick="generateVideo()" id="genBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl mt-6 transition shadow-lg shadow-blue-900/20">
                    بدء تحريك الصورة مجاناً
                </button>
            </div>
        </div>
    </div>

    <script>
        // كود تفاعل رفع الصور
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    uploadPlaceholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // كود تفاعل زر التوليد
        function generateVideo() {
            const btn = document.getElementById('genBtn');
            const resultArea = document.getElementById('resultArea');
            const prompt = document.getElementById('promptText').value;

            if (!fileInput.files[0]) {
                alert("من فضلك ارفع صورة أولاً!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري الاتصال بالسيرفر...";
            resultArea.innerHTML = '<div class="text-center"><div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-blue-500 mb-2"></div><p class="text-blue-400">جاري معالجة ملامح الوجه...</p></div>';

            // محاكاة لعملية الذكاء الاصطناعي (سنربطها حقيقياً لاحقاً)
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "بدء تحريك الصورة مجاناً";
                resultArea.innerHTML = '<p class="text-green-400 text-center px-4">تمت المحاكاة بنجاح! <br> للتحريك الفعلي نحتاج لربط مفتاح الـ API في الخطوة القادمة.</p>';
            }, 3000);
        }
    </script>
</body>
</html>
